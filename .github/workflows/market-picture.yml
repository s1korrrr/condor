name: Market Picture dashboard

on:
  pull_request:
    paths:
      - '.github/workflows/market-picture.yml'
      - 'frontend/**'
      - 'condor/web/**'
      - 'tests/test_market_picture*'
      - 'tests/test_screener_routes.py'
      - 'tests/fixtures/market-picture*'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: market-picture-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  dashboard:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Install frontend dependencies
        working-directory: frontend
        run: npm ci
      - name: Test and build dashboard
        working-directory: frontend
        run: |
          node --test test/*.test.mjs
          npx eslint src/features/market-picture
          npm run build
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: '3.12'
      - name: Install focused gateway dependencies
        run: >-
          python -m pip install fastapi==0.141.1 starlette==1.6.0 httpx==0.28.1
          pydantic==2.13.4 aiohttp==3.13.5 PyYAML==6.0.3 jsonschema==4.26.0
          'python-jose[cryptography]==3.5.0' python-dotenv==1.2.2
          pytest==8.4.2 pytest-asyncio==1.2.0
      - name: Test authenticated gateway and cross-owner schemas
        env:
          PYTHONPATH: .
        run: >-
          python -m pytest -q tests/test_screener_routes.py
          tests/test_market_picture_routes.py tests/test_market_picture_contract.py
