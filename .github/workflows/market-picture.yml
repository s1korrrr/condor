name: Market Picture dashboard

on:
  pull_request:
    paths:
      - '.github/workflows/market-picture.yml'
      - 'frontend/**'
      - 'condor/web/**'
      - 'tests/test_market_picture*'
      - 'tests/test_screener_routes.py'
      - 'tests/fixtures/market-picture*'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: market-picture-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  dashboard:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          persist-credentials: false
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Install frontend dependencies
        working-directory: frontend
        run: npm ci
      - name: Test and build dashboard
        working-directory: frontend
        run: |
          # Root-owned quant-ops panels are checked in the rsibot workspace.
          # This owner workflow needs no adjacent private workspace checkout.
          node --test test/market-picture-*.test.mjs test/screener-*.test.mjs test/server-*.test.mjs
          npx eslint src/features/market-picture
          npm run build
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: '3.12'
      - name: Install focused gateway dependencies
        run: >-
          python -m pip install fastapi==0.141.1 starlette==1.6.0 httpx==0.28.1
          pydantic==2.13.4 aiohttp==3.13.5 PyYAML==6.0.3 jsonschema==4.26.0
          'python-jose[cryptography]==3.5.0' python-dotenv==1.2.2
          pytest==8.4.2 pytest-asyncio==1.2.0
      - name: Test authenticated gateway and cross-owner schemas
        env:
          PYTHONPATH: .
        run: >-
          python -m pytest -q tests/test_screener_routes.py
          tests/test_market_picture_routes.py tests/test_market_picture_contract.py
