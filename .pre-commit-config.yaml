repos:
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v4.0.1  # Use the latest revision
    hooks:
      - id: trailing-whitespace
      - id: end-of-file-fixer
      - id: check-yaml
      - id: check-added-large-files
        # Real builder output exercises the 240-member, 2 MiB frame contract; the fleet market
        # index parity fixture is the iOS repo's file byte for byte (real 1D pair responses).
        exclude: ^tests/fixtures/(market-picture\.240\.fixture|fleet_market_index_parity_v1)\.json$

  -   repo: https://github.com/pycqa/isort
      rev: 5.13.2
      hooks:
      -   id: isort
          name: isort (python)
  -   repo: https://github.com/psf/black
      rev: 23.12.0
      hooks:
      -   id: black
